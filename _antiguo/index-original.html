        }
        .plantas {

            margin-top: 20px;
        }
        .planta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;

            margin: 15px;
            text-align: center;
            transition: transform 0.3s ease;

            background-color: white;
            padding: 10px;
            border-radius: 10px;

        }
        .planta:hover {
            transform: scale(1.1);
        }
        .planta img {
            width: 100px;
            height: 100px;
            border-radius: 10px;
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            padding: 20px;
            text-align: left;
        }
        .overlay img {
            max-width: 60%;
            max-height: 60%;
            border-radius: 10px;
            margin-bottom: 20px;
        }

    max-width: 80%;

                    div.className = "planta";
                    div.innerHTML = `
    <img src="${planta.img}" alt="${planta.nombre}" onclick="mostrarDetalles('${planta.nombre}', '${planta.descripcion}', '${planta.img}', '${planta.preparacion}', '${planta.curiosidades}')">
    <p><strong>${planta.nombre}</strong></p>
`;

                    contenedor.appendChild(div);
                });
            }
        }

        function mostrarDetalles(nombre, descripcion, img, preparacion, curiosidades) {
    document.getElementById("imagenAmpliada").src = img;
    document.getElementById("nombrePlanta").innerText = nombre;
    document.getElementById("descripcionPlanta").innerText = descripcion;
    document.getElementById("preparacionPlanta").innerText = "Preparación: " + preparacion;
    document.getElementById("curiosidadesPlanta").innerText = "Curiosidades: " + curiosidades;
    document.getElementById("overlay").style.display = "flex";
}


        function cerrarOverlay() {
            document.getElementById("overlay").style.display = "none";
        }
    </script>
</body>
</html>
